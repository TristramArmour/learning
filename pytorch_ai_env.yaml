name: pytorch_ai_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pytorch=2.0.1
  - torchvision=0.15.2
  - torchaudio=2.0.2
  - pytorch-cuda=11.8
  - cudatoolkit=11.8
  - pytorch-lightning=2.0.5
  - numpy
  - pandas
  - scikit-learn
  - matplotlib
  - seaborn
  - jupyter
  - ipykernel
  - tqdm
  - tensorboard
  - opencv
  - pillow
  - transformers
  - datasets
  - nltk
  - spacy
  - scipy
  - pip
  - pip:
      - torchmetrics
      - wandb
      - mlflow
      - kaggle
      - albumentations
      - efficientnet-pytorch
      - timm